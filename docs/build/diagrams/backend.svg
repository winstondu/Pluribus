<text x="409" y="711" font-size="11.5" font-weight="600" fill="#26303a" text-anchor="middle">Decomposer</text>
<rect x="483" y="686" width="130" height="40" rx="8" fill="#ffffff" stroke="#6b7785" stroke-width="1.2"/>
<text x="548" y="711" font-size="11.5" font-weight="600" fill="#26303a" text-anchor="middle">EventStore</text>
<rect x="622" y="686" width="130" height="40" rx="8" fill="#ffffff" stroke="#6b7785" stroke-width="1.2"/>
<text x="687" y="711" font-size="11.5" font-weight="600" fill="#26303a" text-anchor="middle">ProjectionCache</text>
<rect x="761" y="686" width="130" height="40" rx="8" fill="#ffffff" stroke="#6b7785" stroke-width="1.2"/>
<text x="826" y="711" font-size="11.5" font-weight="600" fill="#26303a" text-anchor="middle">SecretsStore</text>
<rect x="900" y="686" width="130" height="40" rx="8" fill="#ffffff" stroke="#6b7785" stroke-width="1.2"/>
<text x="965" y="711" font-size="11.5" font-weight="600" fill="#26303a" text-anchor="middle">Clock · Timers · Ids</text>
<rect x="1039" y="686" width="130" height="40" rx="8" fill="#ffffff" stroke="#6b7785" stroke-width="1.2"/>
<text x="1104" y="711" font-size="11.5" font-weight="600" fill="#26303a" text-anchor="middle">ContextSummariser</text>
<rect x="52" y="776" width="560" height="84" rx="10" fill="#f3f4f6" stroke="#9aa3ad" stroke-width="1.2"/>
<text x="64" y="798" font-size="13" font-weight="600" fill="#26303a" text-anchor="start">packages/providers · OpenRouter adapters</text>
<text x="64" y="818" font-size="12" font-weight="400" fill="#4a5562" text-anchor="start">Streaming answers (SSE) with error mapping · Decisions · generative decomposer</text>
<text x="64" y="835" font-size="12" font-weight="400" fill="#4a5562" text-anchor="start">Scripted fake provider for tests</text>
<rect x="628" y="776" width="560" height="84" rx="10" fill="#f3f4f6" stroke="#9aa3ad" stroke-width="1.2"/>
<text x="640" y="798" font-size="13" font-weight="600" fill="#26303a" text-anchor="start">packages/storage · adapters</text>
<text x="640" y="818" font-size="12" font-weight="400" fill="#4a5562" text-anchor="start">Event store · projection cache · local secrets store</text>
<text x="640" y="835" font-size="12" font-weight="400" fill="#4a5562" text-anchor="start">IndexedDB in the app, in-memory in tests</text>
